<!DOCTYPE html>
<html dir='rtl' lang='ar' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
<meta charset='UTF-8'/>
<meta content='width=device-width, initial-scale=1, viewport-fit=cover' name='viewport'/>
<meta content='#031b16' name='theme-color'/>
<title>اثره الطيب - الحاج مطاوع</title>
<link href='https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap' rel='stylesheet'/>
<link href='https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap' rel='stylesheet'/>
<style id='page-skin-1' type='text/css'><!--
* { box-sizing:border-box; }
html, body { margin:0; padding:0; background:#020f0c; }
body { min-height:100vh; overflow-x:hidden; }
/* ===== Home: same design as the أثره الطيب app ===== */
.home { max-width:640px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 10px) 16px 0; direction:rtl; color:#fff; font-family:Tahoma,Arial,sans-serif; }
.home a { text-decoration:none; color:inherit; }
.home button { font-family:inherit; }
.ic { display:inline-flex; align-items:center; justify-content:center; color:#e8c770; line-height:0; }
.ic svg { width:100%; height:100%; }
.tap { cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform .12s ease; }
.tap:active { transform:scale(.96); }
.h-top { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.h-side { flex:1; min-width:0; }
.h-side.left { display:flex; justify-content:flex-end; }
.h-date { font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.h-sub { color:#aebdb8; font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.h-logo { width:96px; height:52px; object-fit:contain; display:block; }
.icon-btn { width:40px; height:40px; border-radius:13px; background:#06221c; border:1px solid rgba(232,199,112,.2); display:flex; align-items:center; justify-content:center; }
.icon-btn .ic { width:20px; height:20px; }
.hero { display:block; border-radius:22px; padding:16px; border:1px solid rgba(232,199,112,.3); background:linear-gradient(to bottom left,#14513f,#0a2e25 55%,#06221c); overflow:hidden; }
.hero-row { display:flex; align-items:flex-end; gap:8px; }
.hero-main { flex:1; min-width:0; }
.hero-label { color:#aebdb8; font-size:12px; }
.hero-name { color:#e8c770; font:700 32px/1.45 'Amiri',serif; }
.hero-sub { color:#d9e6e2; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hero-count { text-align:left; }
.count { color:#fff; font-size:28px; font-weight:800; letter-spacing:1px; font-variant-numeric:tabular-nums; direction:ltr; }
.count-label { color:#aebdb8; font-size:11px; margin-top:1px; }
.prayers { display:flex; margin-top:14px; padding-top:12px; border-top:1px solid rgba(232,199,112,.15); }
.p { flex:1; text-align:center; }
.p-dot { width:6px; height:6px; border-radius:3px; margin:0 auto 4px; }
.p.on .p-dot { background:#e8c770; box-shadow:0 0 6px #e8c770; }
.p-name { color:#aebdb8; font-size:11.5px; }
.p-time { color:#e6efec; font-size:13px; font-weight:700; margin-top:2px; }
.p.on .p-name, .p.on .p-time { color:#e8c770; }
.hero-btn { display:inline-block; margin-top:12px; background:#e8c770; color:#10241f; border:0; border-radius:999px; padding:8px 20px; font-weight:800; font-size:14px; cursor:pointer; }
.adhan-note { display:flex; align-items:center; gap:10px; margin-top:10px; padding:9px 12px; border-radius:14px; background:rgba(232,199,112,.08); border:1px dashed rgba(232,199,112,.35); }
.adhan-note .ic { width:18px; height:18px; flex-shrink:0; }
.adhan-note-text { flex:1; color:#dce8e4; font-size:12.5px; line-height:1.6; }
.adhan-note-go { color:#e8c770; font-weight:800; font-size:12.5px; white-space:nowrap; }
.sec-head { display:flex; justify-content:space-between; align-items:center; margin:20px 2px 10px; }
.sec-title { color:#e8c770; font:700 20px/1.6 'Amiri',serif; margin:0; }
.sec-action { color:#aebdb8; font-size:12.5px; cursor:pointer; background:none; border:0; padding:0; }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.tile { background:#06221c; border:1px solid rgba(232,199,112,.2); border-radius:18px; padding:12px 2px 10px; display:flex; flex-direction:column; align-items:center; color:#e3ece9; }
.tile-ic { width:42px; height:42px; border-radius:14px; display:flex; align-items:center; justify-content:center; margin-bottom:6px; background:linear-gradient(rgba(232,199,112,.24),rgba(232,199,112,.06)); }
.tile-ic .ic { width:22px; height:22px; }
.tile-text { font-size:12.5px; font-weight:700; white-space:nowrap; }
/* ===== app banner with a live Google Play button ===== */
.app-banner { position:relative; margin-top:12px; border-radius:18px; overflow:hidden; border:1px solid rgba(232,199,112,.35); box-shadow:0 10px 26px rgba(0,0,0,.45); aspect-ratio:1672/941; background:#04150f; }
